name: Lab checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform lab checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Initialise with the committed provider lock file
        run: terraform init -backend=false -input=false -no-color -lockfile=readonly
      - name: Validate
        run: terraform validate -no-color
      - name: Design tests with a mocked provider
        run: terraform test -no-color

  cli-examples:
    name: AWS CLI examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the commands printed in the book against the AWS CLI
        run: |
          aws --version
          python3 tests/cli_examples_check.py
