apiVersion: v1
kind: Namespace
metadata:
  name: cloudbook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cloudbook
spec:
  replicas: 2                      # 2つ動かし続ける
  selector:
    matchLabels:
      app: web
  template:                        # Podのひな形
    metadata:
      labels:
        app: web
    spec:
      topologySpreadConstraints:   # できるだけ、別々のノードに分ける
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          image: nginx:1.27-alpine
          # 第14章のサーバーと同じく、自分の名前を返すページを作ってから、Webサーバーを起動する
          command: ["sh", "-c", "echo \"<h1>$(hostname)</h1>\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
          resources:
            requests:              # 配置の判断に使う、必要な量
              cpu: 50m
              memory: 32Mi
            limits:                # これを超えると、止められる
              memory: 128Mi
          readinessProbe:          # 通信を受けられる状態かを確かめる
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cloudbook
spec:
  selector:
    app: web                       # このラベルが付いたPodへ届ける
  ports:
    - port: 80
      targetPort: 80
