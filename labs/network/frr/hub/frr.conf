hostname hub
log file /var/log/frr/hub.log
!
! wan1 から受け取った経路を優先する（値が大きいほうが選ばれる。既定は100）
route-map PRIMARY permit 10
 set local-preference 200
!
router bgp 64512
 bgp router-id 10.210.1.254
 ! 学習用：受け取る経路と知らせる経路を、絞り込まない
 no bgp ebgp-requires-policy
 ! 1秒ごとに生存を知らせ、3秒届かなければ、相手が落ちたとみなす
 timers bgp 1 3
 neighbor 192.168.255.1 remote-as 65010
 neighbor 192.168.255.1 description wan1
 neighbor 192.168.255.1 timers connect 5
 neighbor 192.168.255.5 remote-as 65010
 neighbor 192.168.255.5 description wan2
 neighbor 192.168.255.5 timers connect 5
 !
 address-family ipv4 unicast
  ! 本番の範囲を、相手に知らせる
  network 10.210.1.0/24
  neighbor 192.168.255.1 route-map PRIMARY in
 exit-address-family
!
