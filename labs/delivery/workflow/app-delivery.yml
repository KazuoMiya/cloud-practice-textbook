# 第19章：自分のアプリのリポジトリの .github/workflows/ に置くワークフロー。
# リポジトリの直下に、labs/delivery の app/、deploy.sh、render-taskdef.jq を置いた前提。
# 先に、main のブランチ保護（PRと、このワークフローの test を必須にする）と、
# production 環境（承認者と、デプロイできるブランチを main だけにする設定）を作っておく。
name: App delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: make -C app test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Build, push and deploy
        env:
          AWS_REGION: ap-northeast-1
          ECR_REPOSITORY: cloudbook-app
          ECS_CLUSTER: cloudbook
          ECS_SERVICE: cloudbook-app
          IMAGE_TAG: ${{ github.sha }}
        run: bash deploy.sh
