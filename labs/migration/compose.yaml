# 移行のリハーサル用の、旧環境と新環境。どちらも、手元のPCの中だけで動く。
# ポートを外に公開していないため、PCの外からは接続できない。実習用なので、パスワードなしで接続を許可している。
name: cloudbook-migration

services:
  old-db:                          # 旧環境：サポートが終わった版
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./checks.sql:/checks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 2s
      retries: 30

  new-db:                          # 新環境：移行先
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./checks.sql:/checks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 2s
      retries: 30
